<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versus · Saison 1</title>
<meta name="theme-color" content="#000"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif}
#scene{position:fixed;inset:0;display:grid;place-items:center}
.bande{position:fixed;left:0;right:0;height:11vh;background:#000;z-index:5}.bande.h{top:0}.bande.b{bottom:0}
.fond{position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:0;transition:opacity .25s}.fond.on{opacity:1;animation:kb 3s linear both}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.22) translate(-3%,-2%)}}
.voile{position:absolute;inset:0;background:radial-gradient(110% 60% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.92))}
.txt{position:relative;z-index:3;text-align:center;padding:0 22px;width:100%;max-width:560px;display:grid;justify-items:center}
.l{opacity:0;font-size:clamp(26px,8vw,44px);line-height:1.05;font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 18px rgba(0,0,0,.9)}
.l.on{animation:inl .5s cubic-bezier(.2,.8,.2,1) both}.l.s{font:italic 400 clamp(22px,6.4vw,32px)/1.25 Georgia,serif;text-transform:none}
.mois{display:block;font:600 13px/1 "Saira",sans-serif;letter-spacing:.4em;color:#F7CF55;margin-bottom:8px}
@keyframes inl{from{opacity:0;transform:scale(1.25);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.pilotes{display:flex;gap:12px;justify-content:center;margin-top:14px}.pilotes i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 "Saira",sans-serif;font-style:normal;box-shadow:0 0 0 3px #000,0 0 18px currentColor;opacity:0}
.pilotes i.on{animation:inl .4s both}.pilotes i.cinq{font-size:26px;animation:inl .5s both,pouls 1.1s ease-in-out .9s infinite}@keyframes pouls{50%{box-shadow:0 0 0 3px #000,0 0 34px #B4E33D;transform:scale(1.08)}}
.titre{font-size:clamp(48px,15vw,104px);letter-spacing:.02em;background:linear-gradient(180deg,#fff,#B8A9FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.date{font:600 16px/1.4 "Saira",sans-serif;letter-spacing:.2em;color:#F7CF55;text-transform:uppercase}
.go{margin-top:18px;display:inline-block;padding:12px 22px;border-radius:999px;background:#9B87FF;color:#0B0B12;font:800 18px/1 "Saira",sans-serif;text-decoration:none;opacity:0}
.go.on{animation:inl .5s both}
#lancer{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#000;border:0;color:#fff;font:800 22px/1.3 "Saira",sans-serif;letter-spacing:.2em}
#lancer small{display:block;font:400 13px/1.4 "Saira",sans-serif;letter-spacing:.1em;color:#A9B1BD;margin-top:8px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:4;pointer-events:none}.flash.on{animation:fl .35s ease-out}
@keyframes fl{from{opacity:.85}to{opacity:0}}
</style></head><body>
<div id="scene"><div class="fond" id="f1"></div><div class="fond" id="f2"></div><div class="voile"></div><div class="txt" id="txt"></div></div>
<div class="flash" id="flash"></div><div class="bande h"></div><div class="bande b"></div>
<button id="lancer" type="button">▶ BANDE-ANNONCE<small>Saison 1 · monte le son</small></button>
<script>window.matchMedia = window.matchMedia || (() => ({ matches: false }));</script>
<script src="img/cartes/cartes.js"></script>
<script src="piste.js"></script>
<script>
const COUL = ["#4C9AFF", "#2BB6A3", "#FF6FA8", "#F2994A"], NOMS = ["Théo", "Kévin", "Clément", "Devlin"];
const carte = id => { try { return window.Piste && Piste.carte(id); } catch (e) { return null; } };
// [durée ms, carte, mois, texte, style, son]  — sons : h battements de cœur · b « braam » de cuivres · t tambour · o ostinato (jusqu'au prochain b) · r montée · B final (braam + cymbale)
const LONG = [
  [3000, null, "", "Ils pensaient juste épargner.", "s", "h"],
  [2600, null, "", "Ils se sont trompés.", "s", "t"],
  [3000, "pilotes", "", "4 pilotes.", "", "b"],
  [2400, "cinq", "", "Et bientôt… un 5ᵉ sur la piste.", "s", "t"],
  [1300, "bahrein", "JANVIER", "12 univers.", "", "to"],
  [1500, "djeddah", "FÉVRIER", "Un dragon sous la banque.", "s", "t"],
  [1500, "melbourne", "MARS", "Le Chapelier sert le thé.", "s", "t"],
  [1500, "montreal", "JUIN", "Le côté obscur vous attend.", "s", "t"],
  [1500, "silverstone", "JUILLET", "Quelque chose bouge sous le sable.", "s", "t"],
  [1500, "singapour", "OCTOBRE", "Cinq tickets d'or. Pas un de plus.", "s", "t"],
  [1500, "interlagos", "NOVEMBRE", "Ils sont derrière le mur.", "s", "t"],
  [2200, "lasvegas", "DÉCEMBRE", "Une seule finale.", "", "b"],
  [2400, null, "", "Six pierres. Un seul claquement de doigts.", "s", "t"],
  [2400, null, "", "Une seule couronne. « Qu'on lui coupe la tête ! »", "s", "tr"],
  [6000, "fin", "", "", "", "B"]];
const COURT = [
  [2200, null, "", "Ils pensaient juste épargner.", "s", "h"],
  [2000, "pilotes", "", "4 pilotes.", "", "b"],
  [1600, "cinq", "", "Et bientôt… un 5ᵉ.", "s", "t"],
  [700, "bahrein", "", "", "", "to"], [700, "djeddah", "", "", "", "t"], [700, "melbourne", "", "", "", "t"],
  [700, "montreal", "", "", "", "t"], [700, "silverstone", "", "", "", "t"], [700, "interlagos", "", "", "", "t"],
  [1700, "lasvegas", "", "12 univers. Un seul champion.", "", "b"],
  [1300, null, "", "", "", "r"],
  [4200, "demain", "", "", "", "B"]];
const COURTE = location.hash.indexOf("court") >= 0, PLANS = COURTE ? COURT : LONG;
/* ---------- la partition : un seul code pour la page (son en direct) et pour la vidéo (rendu hors ligne, identique) ---------- */
function bruit(ac, d) { const b = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * d)), ac.sampleRate), c = b.getChannelData(0); for (let i = 0; i < c.length; i++) c[i] = Math.random() * 2 - 1; const n = ac.createBufferSource(); n.buffer = b; return n; }
function sortie(ac) { if (!ac._bus) { const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; const g = ac.createGain(); g.gain.value = .9; comp.connect(g).connect(ac.destination); ac._bus = comp; } return ac._bus; }
function tambour(ac, t, v) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .5); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.001, t + .9); o.connect(g).connect(sortie(ac)); o.start(t); o.stop(t + 1);
  const n = bruit(ac, .15), f = ac.createBiquadFilter(), gn = ac.createGain(); f.type = "lowpass"; f.frequency.value = 900; gn.gain.setValueAtTime(v * .7, t); gn.gain.exponentialRampToValueAtTime(.001, t + .12); n.connect(f).connect(gn).connect(sortie(ac)); n.start(t); }
function braam(ac, t, d, v) { const f = ac.createBiquadFilter(), sh = ac.createWaveShaper(), g = ac.createGain(), cv = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = i / 128 - 1; cv[i] = Math.tanh(2.5 * x); } sh.curve = cv;
  f.type = "lowpass"; f.Q.value = 2; f.frequency.setValueAtTime(90, t); f.frequency.exponentialRampToValueAtTime(1500, t + .22); f.frequency.exponentialRampToValueAtTime(260, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .05); g.gain.setValueAtTime(v, t + d * .5); g.gain.exponentialRampToValueAtTime(.001, t + d); sh.connect(f).connect(g).connect(sortie(ac));
  [36.7, 36.85, 73.4, 73.7, 110, 146.8].forEach(fr => { const o = ac.createOscillator(), gg = ac.createGain(); o.type = "sawtooth"; o.frequency.value = fr; gg.gain.value = .22; o.connect(gg).connect(sh); o.start(t); o.stop(t + d + .1); });
  const s = ac.createOscillator(), gs = ac.createGain(); s.frequency.setValueAtTime(55, t); s.frequency.exponentialRampToValueAtTime(30, t + d); gs.gain.setValueAtTime(v * .9, t); gs.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(gs).connect(sortie(ac)); s.start(t); s.stop(t + d + .1); }
function cymbale(ac, t, v) { const n = bruit(ac, 3.5), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = "highpass"; f.frequency.value = 3500; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + 3.4); n.connect(f).connect(g).connect(sortie(ac)); n.start(t); }
function montee(ac, t, d, v) { const n = bruit(ac, d), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = "bandpass"; f.Q.value = 1.2; f.frequency.setValueAtTime(250, t); f.frequency.exponentialRampToValueAtTime(5000, t + d); g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(v, t + d); n.connect(f).connect(g).connect(sortie(ac)); n.start(t);
  const o = ac.createOscillator(), go = ac.createGain(); o.type = "triangle"; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, t + d); go.gain.setValueAtTime(.001, t); go.gain.exponentialRampToValueAtTime(v * .5, t + d); o.connect(go).connect(sortie(ac)); o.start(t); o.stop(t + d); }
function ostinato(ac, t, d) { const notes = [73.4, 73.4, 87.3, 73.4, 65.4, 73.4, 98, 87.3], pas = .1875; for (let k = 0; k * pas < d; k++) { const tt = t + k * pas, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), v = .05 + .12 * (k * pas / d);
  o.type = "sawtooth"; o.frequency.value = notes[k % 8] * (k % 16 >= 8 ? 1 : 2); f.type = "lowpass"; f.frequency.value = 700 + 1200 * (k * pas / d); g.gain.setValueAtTime(v, tt); g.gain.exponentialRampToValueAtTime(.001, tt + .16); o.connect(f).connect(g).connect(sortie(ac)); o.start(tt); o.stop(tt + .18); } }
function nappe(ac, t, d) { const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.1, t + 4); g.gain.setValueAtTime(.1, t + d - 1); g.gain.linearRampToValueAtTime(0, t + d); g.connect(sortie(ac));
  [55, 82.4].forEach(f => { const o = ac.createOscillator(); o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + d); }); }
function partition(ac, t0, P) {
  let t = t0; const fin = P.findIndex(p => p[5].indexOf("B") >= 0), tFin = t0 + P.slice(0, fin).reduce((s, p) => s + p[0], 0) / 1000;
  nappe(ac, t0, tFin - t0 - .35);
  P.forEach((p, i) => { const s = p[5], d = p[0] / 1000;
    if (s.indexOf("h") >= 0) for (let k = 0; k * .8 < d; k++) { tambour(ac, t + k * .8, .35); tambour(ac, t + k * .8 + .2, .22); }
    if (s.indexOf("t") >= 0) tambour(ac, t, .9);
    if (s.indexOf("b") >= 0) { braam(ac, t, Math.min(3.2, d + .8), .55); tambour(ac, t, 1); }
    if (s.indexOf("o") >= 0) { let d2 = 0; for (let j = i; j < P.length && (j === i || P[j][5].indexOf("b") < 0); j++) d2 += P[j][0] / 1000; ostinato(ac, t, d2); }
    if (s.indexOf("r") >= 0) montee(ac, t + .1, d - .45, .5);
    if (s.indexOf("B") >= 0) { braam(ac, t, 4.5, .75); tambour(ac, t, 1.2); cymbale(ac, t, .35); }
    t += d; });
  return t - t0;
}
let audio = null, alt = 0;
function plan(i) {
  if (i >= PLANS.length) return; const [d, id, mois, t, st] = PLANS[i], txt = document.getElementById("txt");
  const f = document.getElementById(alt ? "f1" : "f2"), autre = document.getElementById(alt ? "f2" : "f1"); alt = 1 - alt;
  const img = id && id !== "pilotes" && id !== "fin" && id !== "demain" ? carte(id) : null;
  if (img) { f.style.backgroundImage = 'url("' + img + '")'; f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); autre.classList.remove("on"); } else { f.classList.remove("on"); autre.classList.remove("on"); }
  if (id === "pilotes") txt.innerHTML = '<div class="l on">' + t + '</div><div class="pilotes">' + NOMS.map((n, k) => '<i style="color:' + COUL[k] + ';background:' + COUL[k] + '22;animation-delay:' + (.3 + k * .35) + 's" class="on">' + n + "</i>").join("") + "</div>";
  else if (id === "cinq") txt.innerHTML = '<div class="l on ' + st + '">' + t + '</div><div class="pilotes">' + NOMS.map((n, k) => '<i style="color:' + COUL[k] + ';background:' + COUL[k] + '22;opacity:.35">' + n + "</i>").join("") + '<i class="on cinq" style="color:#B4E33D;background:#B4E33D22;animation-delay:.5s">?</i></div>';
  else if (id === "fin") txt.innerHTML = '<div class="l on titre">VERSUS</div><div class="l on date" style="animation-delay:.6s">Saison 1 · 2027</div><div class="l on s" style="animation-delay:1.2s">Les moteurs chauffent le 1<sup>er</sup> décembre.</div><a class="go on" style="animation-delay:2s" href="./">Entrer dans la course 🏁</a>';
  else if (id === "demain") txt.innerHTML = '<div class="l on titre" style="font-size:clamp(56px,19vw,120px)">Demain.</div><div class="l on date" style="animation-delay:1.4s">VERSUS · samedi 9 h 🏁</div>';
  else txt.innerHTML = (mois ? '<span class="mois">' + mois + "</span>" : "") + (t ? '<div class="l on ' + st + '">' + t + "</div>" : "");
  if (img || id === "pilotes" || id === "cinq" || id === "fin" || id === "demain") { const fl = document.getElementById("flash"); fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on"); }
  setTimeout(() => plan(i + 1), d);
}
/** pour la vidéo : la même partition rendue hors ligne, renvoyée en WAV (base64) */
async function rendreSon() { const total = PLANS.reduce((s, p) => s + p[0], 0) / 1000 + 4, oac = new OfflineAudioContext(2, Math.ceil(44100 * total), 44100); partition(oac, 0, PLANS); const b = await oac.startRendering();
  const n = b.length, buf = new DataView(new ArrayBuffer(44 + n * 4)), w = (o, s) => { for (let i = 0; i < s.length; i++) buf.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); buf.setUint32(4, 36 + n * 4, true); w(8, "WAVEfmt "); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 2, true); buf.setUint32(24, 44100, true); buf.setUint32(28, 176400, true); buf.setUint16(32, 4, true); buf.setUint16(34, 16, true); w(36, "data"); buf.setUint32(40, n * 4, true);
  const L = b.getChannelData(0), R = b.getChannelData(1); for (let i = 0; i < n; i++) { buf.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); buf.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  let s = ""; const u = new Uint8Array(buf.buffer); for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
document.getElementById("lancer").addEventListener("click", e => { try { audio = new (window.AudioContext || window.webkitAudioContext)(); partition(audio, audio.currentTime + .3, PLANS); } catch (_) { } e.currentTarget.remove(); setTimeout(() => plan(0), 300); });
if (location.hash.indexOf("auto") >= 0) { document.getElementById("lancer").remove(); setTimeout(() => plan(0), 300); }
</script></body></html>
