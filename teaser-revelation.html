<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versus · Les 12 univers</title>
<meta name="theme-color" content="#000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif}
#scene{position:fixed;inset:0;display:grid;place-items:center}
.bande{position:fixed;left:0;right:0;height:11vh;background:#000;z-index:5}.bande.h{top:0}.bande.b{bottom:0}
.fond{position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:0;transition:opacity .25s}.fond.net{transition:none}
.fond.on{opacity:1;animation:kb 3s linear both}
@keyframes kb{from{transform:scale(1);background-position:40% 50%}to{transform:scale(1.09);background-position:60% 50%}}
.fond.flou{filter:blur(9px) brightness(.68) saturate(.85)}
.fond.sombre{filter:brightness(.8) saturate(.8)}
.voile{position:absolute;inset:0;background:radial-gradient(110% 60% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.92))}
#scene.carte .voile{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.05) 35%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.88) 80%)}
#scene.sansvoile .voile{display:none}
#scene.carte{place-items:end center}#scene.carte .txt{padding-bottom:calc(11vh + 26px)}
.obj{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none}
.txt{position:relative;z-index:3;text-align:center;padding:0 22px;width:100%;max-width:560px;display:grid;justify-items:center}
.l{opacity:0;font-size:clamp(26px,8vw,44px);line-height:1.05;font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 18px rgba(0,0,0,.9)}
.l.on{animation:inl .5s cubic-bezier(.2,.8,.2,1) both}.l.s{font:italic 400 clamp(22px,6.4vw,32px)/1.25 Georgia,serif;text-transform:none}
.l.net{opacity:1}.l.net.on{animation:nette .12s ease-out both}
@keyframes nette{from{opacity:.2;transform:scale(1.05)}to{opacity:1;transform:none}}
.or{color:#F7CF55;font-style:italic}
.l.gp{font-size:clamp(24px,7.4vw,40px)}.l.gp.sous{font:700 clamp(15px,4.4vw,20px)/1.3 "Saira",sans-serif;letter-spacing:.06em;color:#F7CF55;margin-top:10px;text-transform:none}
.moisXL{font:800 clamp(56px,17vw,100px)/.95 "Saira Condensed",sans-serif;letter-spacing:.03em}
.mois{display:block;font:600 13px/1 "Saira",sans-serif;letter-spacing:.4em;color:#F7CF55;margin-bottom:8px}
.petit{font:600 clamp(14px,4vw,17px)/1.4 "Saira",sans-serif;letter-spacing:.18em;color:#F7CF55;text-transform:uppercase;margin-top:12px}
@keyframes inl{from{opacity:0;transform:scale(1.25);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.pilotes{display:flex;gap:12px;justify-content:center;margin-top:14px}.pilotes i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 "Saira",sans-serif;font-style:normal;box-shadow:0 0 0 3px #000,0 0 18px currentColor;opacity:0}
.pilotes i.on{animation:inl .4s both}.pilotes i.cinq{font-size:26px;animation:inl .5s both,pouls 1.1s ease-in-out .9s infinite}@keyframes pouls{50%{box-shadow:0 0 0 3px #000,0 0 34px #B4E33D;transform:scale(1.08)}}
.titre{font-size:clamp(48px,15vw,104px);letter-spacing:.02em;background:linear-gradient(180deg,#fff,#B8A9FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.date{font:600 16px/1.4 "Saira",sans-serif;letter-spacing:.2em;color:#F7CF55;text-transform:uppercase}
.ligne{opacity:0;font:700 clamp(19px,5.6vw,26px)/1.35 "Saira",sans-serif;margin-top:10px;display:flex;align-items:center;gap:10px;justify-content:center;text-shadow:0 0 14px #000}
.ligne.on{animation:inl .35s cubic-bezier(.2,.8,.2,1) both}.ligne.dore{color:#F7CF55;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(14px,4vw,17px)}
.go{margin-top:18px;display:inline-block;padding:12px 22px;border-radius:999px;background:#9B87FF;color:#0B0B12;font:800 18px/1 "Saira",sans-serif;text-decoration:none;opacity:0}
.go.on{animation:inl .5s both}
#lancer{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#000;border:0;color:#fff;font:800 22px/1.3 "Saira",sans-serif;letter-spacing:.2em}
#lancer small{display:block;font:400 13px/1.4 "Saira",sans-serif;letter-spacing:.1em;color:#A9B1BD;margin-top:8px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:4;pointer-events:none}.flash.on{animation:fl .35s ease-out}
@keyframes fl{from{opacity:.85}to{opacity:0}}.flash.doux.on{animation:fld .18s ease-out}@keyframes fld{from{opacity:.28}to{opacity:0}}
#compteur{position:fixed;z-index:6;top:calc(11vh - 34px);left:0;right:0;text-align:center;font:700 22px/1 "Saira Condensed",sans-serif;letter-spacing:.3em;color:#F7CF55;text-shadow:0 0 12px rgba(247,207,85,.6)}
#compteur.on{animation:cpt .2s ease-out}@keyframes cpt{from{transform:scale(1.35);opacity:.4}to{transform:none;opacity:1}}
/* affiche (1re image = vignette WhatsApp) */
.affiche .titre{font-size:clamp(64px,21vw,128px)}
/* la Coupe en éclats */
.coupe{width:min(56vw,300px);overflow:visible}.coupe .entier{transform-box:fill-box;transform-origin:center;animation:tremble .5s linear .05s both}
@keyframes tremble{0%,100%{transform:none}20%{transform:translate(-1.5px,1px) rotate(-.6deg)}40%{transform:translate(2px,-1px) rotate(.8deg)}60%{transform:translate(-2px,0) rotate(-1deg)}80%{transform:translate(2.5px,1px) rotate(1.2deg)}}
.coupe .ec{transform-box:fill-box;transform-origin:center;animation:eclat 1.25s cubic-bezier(.12,.75,.3,1) .55s both}
@keyframes eclat{from{transform:none;opacity:1}70%{opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.eclair{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff,rgba(255,236,170,.6) 30%,transparent 65%);opacity:0;animation:fl .4s ease-out .55s}
/* l'objet caché : lampe torche */
.torche{position:absolute;left:50%;top:50%;width:400vmax;height:400vmax;margin:-200vmax 0 0 -200vmax;background:radial-gradient(circle,rgba(0,0,0,0) 0,rgba(0,0,0,0) 62px,rgba(0,0,0,.55) 92px,rgba(0,0,0,.93) 135px);animation:torche 2s cubic-bezier(.45,0,.4,1) both}
@keyframes torche{0%{transform:translate(-26vw,-20vh)}30%{transform:translate(24vw,-12vh)}58%{transform:translate(-18vw,4vh)}78%,100%{transform:translate(10vw,-6vh)}}
.qm{position:absolute;left:calc(50% + 10vw);top:calc(50% - 6vh);transform:translate(-50%,-50%);font:800 76px/1 "Saira Condensed",sans-serif;color:#F7CF55;text-shadow:0 0 22px rgba(247,207,85,.9),0 0 4px #000;opacity:0;animation:qm .35s cubic-bezier(.2,.8,.2,1) 1.5s both}
@keyframes qm{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
/* le portrait qui se dessine */
.tete{width:46px;height:46px;flex:none;border-radius:50%;background:#F7CF5522;box-shadow:0 0 0 2px #000,0 0 14px #F7CF55;display:grid;place-items:center}
.tete path,.tete circle{fill:none;stroke:#F7CF55;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:trace .9s ease-out both}
@keyframes trace{to{stroke-dashoffset:0}}
/* mosaïque des 12 univers */
.mosa{position:absolute;inset:11vh 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3px;background:#000}
.mosa i{background:center/cover no-repeat;filter:brightness(.72) saturate(.95)}
.plaque{position:relative;z-index:3;padding:18px 18px 16px;background:radial-gradient(closest-side,rgba(0,0,0,.85),rgba(0,0,0,.55) 70%,rgba(0,0,0,0));width:100%}
/* feux de départ */
.feux{display:flex;gap:10px;padding:12px 14px;background:#111;border-radius:12px;box-shadow:0 0 0 2px #262626,0 10px 30px #000}
.feux b{width:44px;display:grid;gap:8px}.feux b u{display:block;width:44px;height:44px;border-radius:50%;background:#2a0505;box-shadow:inset 0 0 8px #000}
.feux b u.rouge{animation:allume .05s linear var(--a) both,eteint .04s linear var(--e) both}
@keyframes allume{from,to{background:#ff2b22;box-shadow:0 0 26px #ff2b22,0 0 8px #fff inset}}
@keyframes eteint{from,to{background:#2a0505;box-shadow:inset 0 0 8px #000}}
</style></head><body>
<div id="scene"><div class="fond" id="f1"></div><div class="fond" id="f2"></div><div class="voile"></div><div class="obj" id="obj"></div><div class="txt" id="txt"></div></div>
<div class="flash" id="flash"></div><div class="bande h"></div><div class="bande b"></div><div id="compteur"></div>
<button id="lancer" type="button">▶ LES 12 UNIVERS<small>Saison 1 · monte le son</small></button>
<script src="img/cartes/cartes.js"></script>
<script>
const COUL = ["#4C9AFF", "#2BB6A3", "#FF6FA8", "#F2994A"], NOMS = ["Théo", "Kévin", "Clément", "Devlin"];
/* les fonds peints cuits (img/cartes/<clé>.webp, empreinte dans cartes.js) : clé du peintre de chaque circuit */
const PEINT = { abudhabi: "garage", silverstone: "dunes", djeddah: "chateau", melbourne: "terrier", suzuka: "anneau", miami: "pandora", montreal: "etoiles", bahrein: "ratatouille", spa: "envers", lasvegas: "odyssee", singapour: "chocolat", interlagos: "titans", monza: "multivers" };
/* noms des Grands Prix (GPS dans js/4-grandprix.js) */
const GP = { abudhabi: "🎅 L'Atelier du Père Noël", silverstone: "🏜️ GP de la Mer de dunes", djeddah: "🏰 GP du Château", melbourne: "🎩 GP des Merveilles", suzuka: "💍 GP de l'Anneau", miami: "🌿 GP de Pandora", montreal: "🌌 GP des Étoiles", bahrein: "🐀 GP du Petit Chef", spa: "🔦 GP du Monde à l'envers", lasvegas: "🌊 GP de l'Odyssée", singapour: "🍫 GP de la Chocolaterie", interlagos: "🧱 GP du Mur des titans", monza: "🌀 GP du Multivers" };
const SAISON = ["silverstone", "djeddah", "melbourne", "suzuka", "miami", "montreal", "bahrein", "spa", "lasvegas", "singapour", "interlagos", "monza"];
const carte = id => { const k = PEINT[id], c = self.CARTES_CUITES || {}; return k ? "img/cartes/" + k + ".webp" + (c[k] ? "?v=" + c[k] : "") : null; };
const IMAGES = Object.keys(PEINT).map(id => { const i = new Image(); i.decoding = "async"; i.src = carte(id); return i; });   // préchargées : pas de plan noir
const H = location.hash, VIDEO = /auto|rec/.test(H), NB = " ";
/* les 10 univers en flashes floutés : cadence qui accélère (≈ 375 → 150 ms, calée sur l'ostinato), un tambour par flash qui monte */
function flashes(ids, cpt) { const d = [375, 375, 375, 300, 250, 225, 200, 175, 150, 150]; return ids.map((id, k) => [d[k], id, "", "", "flou net", "t:" + (.42 + .58 * k / (ids.length - 1)).toFixed(2), cpt ? { cpt: String(k + 2).padStart(2, "0") + " / 12" } : null]); }
// [durée ms, plan, mois, texte, style, son, options]
// sons (séparés par des espaces, « code@décalage:volume ») : h battements · t tambour · b braam · o ostinato (jusqu'au prochain b/B/S) · r montée · B coup final · S silence · p bip des feux · m moteur
// texte vide sur un circuit = le nom du Grand Prix
/*PLANS*/
const MOIS = ["FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE"];
const FEUX = [.3, .9, 1.5, 2.1, 2.7], EXT = 3.45;
const PLANS = [
  [550, "affiche-mosaique", "", "", "", "t:.8"],
  [2200, null, "", "Ils pensaient juste épargner.", "s", "h"],
  [1800, null, "", "Ils se sont trompés.", "s", "t"],
  [2200, "pilotes", "", "4 pilotes.", "", "b t@.3:.45 t@.65:.5 t@1:.55 t@1.35:.6"],
  [2400, "cinq", "", "Et bientôt… un 5ᵉ sur la piste.", "s", "t t@.5:.6"],
  [1700, "silverstone", "JANVIER", "", "rev net", "t o", { haut: "12 univers · 12 mois" }],
  ...SAISON.slice(1, 11).map((id, k) => [1125, id, MOIS[k], "", "rev net", "t:" + (.55 + .4 * k / 9).toFixed(2)]),
  [550, "noir", "", "", "", "S"],
  [2600, "monza", "DÉCEMBRE", "Une seule finale.", "rev net fort", "B"],
  [2000, "coupe", "", "🏆 La Coupe a volé en éclats.", "s", "t:.5 b@.55"],
  [2000, "cache", "", "🗝️ Un objet est caché sur chaque circuit…", "s", "t t@1.5:.7"],
  [3600, "feux", "", "Pilotes, en place.", "", "m " + FEUX.map(a => "p@" + a).join(" "), { feux: FEUX, ext: EXT }],
  [500, "noir", "", "", "", "S"],
  [6000, "depart", "", "", "", "B t@.3:.5 t@.65:.55 t@1:.6 t@1.35:.65 t@1.9:.8"]];
/*FIN PLANS*/
/* ---------- la partition : un seul code pour la page (son en direct) et pour la vidéo (rendu hors ligne, identique) ---------- */
function bruit(ac, d) { const b = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * d)), ac.sampleRate), c = b.getChannelData(0); for (let i = 0; i < c.length; i++) c[i] = Math.random() * 2 - 1; const n = ac.createBufferSource(); n.buffer = b; return n; }
function maitre(ac) { if (!ac._maitre) { const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .25; const g = ac.createGain(); g.gain.value = .9; comp.connect(g).connect(ac.destination); ac._maitre = comp; } return ac._maitre; }
const sortie = ac => ac._bus || maitre(ac);
function courbe(k) { const cv = new Float32Array(512); for (let i = 0; i < 512; i++) { const x = i / 256 - 1; cv[i] = Math.tanh(k * x); } return cv; }
/* couche « octave + quinte » (110/147/220 Hz en dents de scie, saturée) : ce qui fait exister les graves dans un haut-parleur de téléphone */
function couche(ac, t, d, v, f0, f1) { const sh = ac.createWaveShaper(), f = ac.createBiquadFilter(), g = ac.createGain(); sh.curve = courbe(3); f.type = "lowpass"; f.Q.value = 1; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + Math.min(.2, d * .3)); f.frequency.exponentialRampToValueAtTime(Math.max(300, f0), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.001, t + d); sh.connect(f).connect(g).connect(sortie(ac));
  [110, 146.8, 220].forEach(fr => { const o = ac.createOscillator(), gg = ac.createGain(); o.type = "sawtooth"; o.frequency.value = fr; gg.gain.value = .3; o.connect(gg).connect(sh); o.start(t); o.stop(t + d + .05); }); }
function clic(ac, t, v) { const n = bruit(ac, .03), f = ac.createBiquadFilter(), f2 = ac.createBiquadFilter(), g = ac.createGain(); f.type = "highpass"; f.frequency.value = 2000; f2.type = "lowpass"; f2.frequency.value = 4500; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .012); n.connect(f).connect(f2).connect(g).connect(sortie(ac)); n.start(t); n.stop(t + .03); }
function tambour(ac, t, v) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .5); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.001, t + .9); o.connect(g).connect(sortie(ac)); o.start(t); o.stop(t + 1);
  const n = bruit(ac, .15), f = ac.createBiquadFilter(), gn = ac.createGain(); f.type = "lowpass"; f.frequency.value = 900; gn.gain.setValueAtTime(v * .7, t); gn.gain.exponentialRampToValueAtTime(.001, t + .12); n.connect(f).connect(gn).connect(sortie(ac)); n.start(t);
  couche(ac, t, .16, v * .32, 500, 2400); clic(ac, t, v * .5); }
function braam(ac, t, d, v) { const f = ac.createBiquadFilter(), sh = ac.createWaveShaper(), g = ac.createGain(); sh.curve = courbe(2.5);
  f.type = "lowpass"; f.Q.value = 2; f.frequency.setValueAtTime(90, t); f.frequency.exponentialRampToValueAtTime(1500, t + .22); f.frequency.exponentialRampToValueAtTime(260, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .05); g.gain.setValueAtTime(v, t + d * .5); g.gain.exponentialRampToValueAtTime(.001, t + d); sh.connect(f).connect(g).connect(sortie(ac));
  [36.7, 36.85, 73.4, 73.7, 110, 146.8].forEach(fr => { const o = ac.createOscillator(), gg = ac.createGain(); o.type = "sawtooth"; o.frequency.value = fr; gg.gain.value = .22; o.connect(gg).connect(sh); o.start(t); o.stop(t + d + .1); });
  couche(ac, t, d * .8, v * .42, 300, 2600);
  const s = ac.createOscillator(), gs = ac.createGain(); s.frequency.setValueAtTime(55, t); s.frequency.exponentialRampToValueAtTime(30, t + d); gs.gain.setValueAtTime(v * .9, t); gs.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(gs).connect(sortie(ac)); s.start(t); s.stop(t + d + .1); }
function cymbale(ac, t, v) { const n = bruit(ac, 3.5), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = "highpass"; f.frequency.value = 3500; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + 3.4); n.connect(f).connect(g).connect(sortie(ac)); n.start(t); }
function boum(ac, t, v) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.6); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + 2.4); o.connect(g).connect(sortie(ac)); o.start(t); o.stop(t + 2.5); }
/* accord final (ré mineur ouvert) : cuivres tenus qui s'éteignent */
function accord(ac, t, d, v) { const f = ac.createBiquadFilter(), g = ac.createGain(); f.type = "lowpass"; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2200, t + .3); f.frequency.exponentialRampToValueAtTime(500, t + d); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .08); g.gain.setValueAtTime(v, t + d * .35); g.gain.exponentialRampToValueAtTime(.001, t + d); f.connect(g).connect(sortie(ac));
  [146.8, 220, 293.7, 349.2, 440].forEach((fr, k) => [-6, 6].forEach(c => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr; o.detune.value = c; const gg = ac.createGain(); gg.gain.value = .08 / (1 + k * .3); o.connect(gg).connect(f); o.start(t); o.stop(t + d + .05); })); }
function montee(ac, t, d, v) { const n = bruit(ac, d), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = "bandpass"; f.Q.value = 1.2; f.frequency.setValueAtTime(250, t); f.frequency.exponentialRampToValueAtTime(5000, t + d); g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(v, t + d); n.connect(f).connect(g).connect(sortie(ac)); n.start(t);
  const o = ac.createOscillator(), go = ac.createGain(); o.type = "sawtooth"; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, t + d); go.gain.setValueAtTime(.001, t); go.gain.exponentialRampToValueAtTime(v * .35, t + d); o.connect(go).connect(sortie(ac)); o.start(t); o.stop(t + d); }
/* ostinato : une note à chaque instant donné (pas régulier de 187,5 ms, puis 2 notes par flash : ça accélère avec les images) */
function ostinato(ac, tps) { const notes = [73.4, 73.4, 87.3, 73.4, 65.4, 73.4, 98, 87.3], n = tps.length;
  tps.forEach((tt, k) => { const p = n > 1 ? k / (n - 1) : 1, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), v = .07 + .13 * p, dur = Math.min(.16, (tps[k + 1] || tt + .2) - tt);
    o.type = "sawtooth"; o.frequency.value = notes[k % 8] * (k % 16 >= 8 ? 2 : 4); f.type = "lowpass"; f.frequency.value = 900 + 1600 * p; g.gain.setValueAtTime(v, tt); g.gain.exponentialRampToValueAtTime(.001, tt + dur); o.connect(f).connect(g).connect(sortie(ac)); o.start(tt); o.stop(tt + dur + .02);
